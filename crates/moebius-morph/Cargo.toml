[package]
name = "moebius-morph"
description = "Headless versioned anatomical specifications and deformable worm compiler."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"

parry3d = { version = "=0.27.0", default-features = false, features = ["required-features", "std", "alloc", "enhanced-determinism"] }

[build-dependencies]
blake3 = "1"
serde_json = "1"

[features]
# Independent HABITAT-001 physical chamber; no ShipRuntime integration.
habitat-experiment = []
# Rejected/unqualified VI lanes remain reproducible but are not runtime defaults.
experimental-collision-frontiers = []
experimental-geometry-reuse = []
allocation-attribution = []
query-trace = []
# Authentic query recipe capture / isolated canonical-query harness only.
collision-fixture = []
# Per-leaf timers are diagnostic and excluded from ordinary timing builds.
kernel-attribution = ["collision-fixture"]
# Explicitly selected history encoding; legacy full-log worlds stay unchanged.
history-v2-prototype = []
# Measurement splice used only by examples/spatial_scale.rs.
# Feature-off runtimes have no method and no extra work.
spatial-scale = []

[[example]]
name = "spatial_scale"
required-features = ["spatial-scale"]

[[example]]
name = "collision_fixture"
required-features = ["collision-fixture"]

[[example]]
name = "morphology_research"
required-features = ["collision-fixture"]

[[example]]
name = "habitat_environment"
required-features = ["habitat-experiment"]
