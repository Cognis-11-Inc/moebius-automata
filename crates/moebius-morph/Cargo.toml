[package]
name = "moebius-morph"
description = "Headless versioned anatomical specifications and deformable worm compiler."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"

parry3d = { version = "=0.27.0", default-features = false, features = ["required-features", "std", "alloc", "enhanced-determinism"] }
